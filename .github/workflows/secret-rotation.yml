name: Secret Rotation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Answers in order: storage location (5 = in-repo, testing only), seed from template, generate secrets, skip authelia menu, skip stack start.
      - name: Bootstrap a fresh machine through setup.sh
        run: |
          set -euo pipefail
          printf '5\ny\ny\nn\nn\n' | ./setup.sh
      - name: Assert the generated state
        run: |
          set -euo pipefail
          expected_secrets=(
            "storage/env/002-immich.env DB_PASSWORD"
            "storage/env/004-dyngress.env AUTHELIA_SESSION_SECRET"
            "storage/env/004-dyngress.env AUTHELIA_STORAGE_ENCRYPTION_KEY"
            "storage/env/004-dyngress.env AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET"
            "storage/env/004-dyngress.env AUTHELIA_IMMICH_OAUTH_CLIENT_SECRET"
            "storage/env/004-dyngress.env AUTHELIA_OIDC_HMAC_SECRET"
            "storage/env/004-dyngress.env AUTHELIA_OIDC_PRIVATE_KEY"
            "storage/env/004-dyngress.env CADDY_MTLS_CA_PRIVATE_KEY"
          )
          for entry in "${expected_secrets[@]}"; do
            read -r secret_file secret_name <<< "$entry"
            grep -q "^${secret_name}=." "$secret_file" || { echo "missing: ${secret_name} in ${secret_file}"; exit 1; }
          done
          # The mobile client cert must chain to the CA Caddy trusts.
          openssl pkcs12 -in storage/keys/002-immich-mobile.p12 -passin pass:immich -nokeys -clcerts 2>/dev/null \
            | openssl x509 -out /tmp/ci-client-cert.crt
          openssl verify -CAfile storage/keys/002-immich-server.crt /tmp/ci-client-cert.crt
          # And the private key inside the p12 must be the key of that client cert.
          openssl pkcs12 -in storage/keys/002-immich-mobile.p12 -passin pass:immich -nokeys -clcerts 2>/dev/null \
            | openssl x509 -pubkey -noout > /tmp/ci-p12-cert-pub.pem
          openssl pkcs12 -in storage/keys/002-immich-mobile.p12 -passin pass:immich -nocerts -nodes 2>/dev/null \
            | openssl pkey -pubout > /tmp/ci-p12-key-pub.pem
          cmp -s /tmp/ci-p12-cert-pub.pem /tmp/ci-p12-key-pub.pem || { echo "p12 private key does not match its client cert"; exit 1; }
      - name: Re-run with every secret kept (idempotency)
        run: |
          set -euo pipefail
          before="$(find storage/env storage/keys -type f -exec md5sum {} + | sort)"
          printf 'n\nn\nn\nn\nn\nn\nn\nn\n' | ./scripts/generate_secrets.sh
          after="$(find storage/env storage/keys -type f -exec md5sum {} + | sort)"
          [ "$before" = "$after" ]
      - name: Rotate one hex secret and the mTLS key, keep the rest
        run: |
          set -euo pipefail
          old_database_password="$(grep '^DB_PASSWORD=' storage/env/002-immich.env | cut -d= -f2)"
          # Answers in secrets-array order: rotate DB_PASSWORD (two confirms), keep six, rotate CADDY_MTLS_CA_PRIVATE_KEY (two confirms).
          printf 'y\ny\nn\nn\nn\nn\nn\nn\ny\ny\n' | ./scripts/generate_secrets.sh
          grep -q '^# ROTATED: DB_PASSWORD=' storage/env/002-immich.env
          new_database_password="$(grep '^DB_PASSWORD=' storage/env/002-immich.env | cut -d= -f2)"
          [ "$old_database_password" != "$new_database_password" ]
          grep -q '^# ROTATED: CADDY_MTLS_CA_PRIVATE_KEY=' storage/env/004-dyngress.env
          # The stale p12 must be archived under a key-derived prefix, and the fresh pair must still chain.
          [ "$(find storage/keys -name '*-002-immich-mobile.p12' | wc -l)" -ge 1 ]
          openssl pkcs12 -in storage/keys/002-immich-mobile.p12 -passin pass:immich -nokeys -clcerts 2>/dev/null \
            | openssl x509 -out /tmp/ci-client-cert.crt
          openssl verify -CAfile storage/keys/002-immich-server.crt /tmp/ci-client-cert.crt
          # The rebuilt bundle must still hold a key matching its own cert.
          openssl pkcs12 -in storage/keys/002-immich-mobile.p12 -passin pass:immich -nokeys -clcerts 2>/dev/null \
            | openssl x509 -pubkey -noout > /tmp/ci-p12-cert-pub.pem
          openssl pkcs12 -in storage/keys/002-immich-mobile.p12 -passin pass:immich -nocerts -nodes 2>/dev/null \
            | openssl pkey -pubout > /tmp/ci-p12-key-pub.pem
          cmp -s /tmp/ci-p12-cert-pub.pem /tmp/ci-p12-key-pub.pem || { echo "p12 private key does not match its client cert"; exit 1; }
