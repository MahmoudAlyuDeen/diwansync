---
# Authelia server configuration for diwansync.
# Mount: ./authelia/configuration.yml → /config/configuration.yml (read-only).

server:
  address: tcp://0.0.0.0:9004

authentication_backend:
  file:
    path: /users_database.yml
    watch: false
    separator: ":"
    disable_add_account: true
    email: "@email"
    name: "@name"
    username: "@username"
    password: "argon2id!password"

session:
  secret: ${AUTHELIA_SESSION_SECRET}
  expiration: "1d"
  inactivity: "1h"
  remember_me_duration: "30d"
  cookies:
    - domain: "${DOMAIN}"
      insecure_warning_expiration: false

access_control:
  default_policy: two_factor
  rules:
    # Authelia portal itself — never gate on itself.
    - domain: "auth.${DOMAIN}"
      policy: bypass

    # Trusted internal networks → one-factor (password only).
    - domain: "*.${DOMAIN}"
      network: "0.0.0.0/0"
      policy: one_factor

    # Public share links — bypass auth entirely.
    - domain: "*.${DOMAIN}"
      path: "/share/*"
      policy: bypass

notifier:
  smtp:
    address: "${AUTHELIA_SMTP_SERVER}:${AUTHELIA_SMTP_PORT}"
    username: "${AUTHELIA_SMTP_USERNAME}"
    password: "${AUTHELIA_SMTP_PASSWORD}"
    sender: "${AUTHELIA_SMTP_EMAIL}"
    startup_check_address: "test@${DOMAIN}"

storage:
  local:
    path: /opt/authelia/db.sqlite3
    autoschema: false

regulation:
  find_time: "2m"
  ban_time: "5m"
  modes: ["user", "ip"]

theme: light
