 services:
  app:
    container_name: nginx-proxy-manager
    image: 'docker.io/jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80'
      - '8000:81'
      - '443:443'
    volumes:
      - ../../storage/volumes/003-nginx/data:/data
      - ../../storage/volumes/003-nginx/letsencrypt:/etc/letsencrypt
