services:
  005-authentik-postgresql:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - ../../storage/volumes/005-authentik/database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
  005-authentik-redis:
    image: docker.io/library/redis:alpine
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - ../../storage/volumes/005-authentik/redis:/data
  005-authentik-server:
    image: ghcr.io/goauthentik/server:2025.2.1
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: 005-authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: 005-authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_ERROR_REPORTING__ENABLED: true
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    volumes:
      - ../../storage/volumes/005-authentik/media:/media
      - ../../storage/volumes/005-authentik/custom-templates:/templates
    env_file:
      - .env
    ports:
      - 8005:9000
      - 9443:9443
    depends_on:
      - 005-authentik-postgresql
      - 005-authentik-redis
  005-authentik-worker:
    image: ghcr.io/goauthentik/server:2025.2.1
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: 005-authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: 005-authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_ERROR_REPORTING__ENABLED: true
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../storage/volumes/005-authentik/media:/media
      - ../../storage/volumes/005-authentik/certs:/certs
      - ../../storage/volumes/005-authentik/custom-templates:/templates
    env_file:
      - .env
    depends_on:
      - 005-authentik-postgresql
      - 005-authentik-redis
